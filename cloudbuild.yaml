substitutions:
  _IMAGE: sample-repo/pyappimg:latest
  _LOCATION: asia-south1-docker.pkg.dev

steps:
 - name: gcr.io/cloud-builders/docker
   args: ['build','-t','${_LOCATION}/${PROJECT_ID}/${_IMAGE}','.']

 - name: gcr.io/cloud-builders/docker
   args: ['push','${_LOCATION}/${PROJECT_ID}/${_IMAGE}']

 - name: gcr.io/cloud-builders/gcloud
   args: ['run','deploy','python-app','--image','${_LOCATION}/${PROJECT_ID}/${_IMAGE}','--location','asia-south1','--allow-unauthenticated']

logsBucket: gs://demo-log

options:
 logging: GCS_ONLY